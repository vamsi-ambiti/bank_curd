<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f4f9;
            padding: 25px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            background: #123b66;
            color: white;
            text-align: center;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: #123b66;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 3px;
        }

        button:hover {
            background: #0d4778;
        }

        .delete {
            background: #dc3545;
        }

        .delete:hover {
            background: #a71d2a;
        }

        .cancel {
            background: #777;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #123b66;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Bank Management System</h1>
        <p>Manage Customer Bank Accounts Easily</p>
    </header>

    <!-- Account Form -->
    <section class="card">

        <h2 id="formTitle">Add Bank Account</h2>

        <form id="bankForm">

            <div class="form-group">
                <label>Account Number</label>
                <input type="text" id="accountNumber"
                       placeholder="Enter account number" required>
            </div>

            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" id="customerName"
                       placeholder="Enter customer name" required>
            </div>

            <div class="form-group">
                <label>Account Type</label>
                <select id="accountType" required>
                    <option value="">Select Account Type</option>
                    <option value="Savings">Savings Account</option>
                    <option value="Current">Current Account</option>
                    <option value="Salary">Salary Account</option>
                </select>
            </div>

            <div class="form-group">
                <label>Balance (₹)</label>
                <input type="number" id="balance"
                       placeholder="Enter balance"
                       min="0" step="0.01" required>
            </div>

            <button type="submit" id="submitButton">
                Add Account
            </button>

            <button type="button" id="cancelButton"
                    class="cancel" hidden>
                Cancel
            </button>

        </form>
    </section>

    <!-- Account Records -->
    <section class="card">

        <h2>Bank Account Records</h2>

        <p id="recordCount">Total Accounts: 0</p>

        <br>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Account Number</th>
                        <th>Customer Name</th>
                        <th>Account Type</th>
                        <th>Balance</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="bankTableBody"></tbody>
            </table>
        </div>

    </section>

    <footer>
        Bank Management System | HTML, CSS and JavaScript
    </footer>

</div>

<script>

    // Load saved accounts
    let accounts = JSON.parse(
        localStorage.getItem("bankAccounts")
    ) || [];

    let editIndex = -1;

    const form = document.getElementById("bankForm");
    const table = document.getElementById("bankTableBody");

    // Save accounts
    function saveAccounts() {
        localStorage.setItem(
            "bankAccounts",
            JSON.stringify(accounts)
        );
    }

    // READ - Display Accounts
    function displayAccounts() {

        table.innerHTML = "";

        accounts.forEach((account, index) => {

            const row = document.createElement("tr");

            const values = [
                account.number,
                account.name,
                account.type,
                "₹" + account.balance.toFixed(2)
            ];

            values.forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const actionCell = document.createElement("td");

            const editBtn = document.createElement("button");
            editBtn.textContent = "Edit";
            editBtn.onclick = () => editAccount(index);

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.className = "delete";
            deleteBtn.onclick = () => deleteAccount(index);

            actionCell.append(editBtn, deleteBtn);
            row.appendChild(actionCell);

            table.appendChild(row);
        });

        document.getElementById("recordCount").textContent =
            "Total Accounts: " + accounts.length;
    }

    // CREATE and UPDATE - Add or Edit Account
    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const account = {
            number: document.getElementById("accountNumber").value.trim(),
            name: document.getElementById("customerName").value.trim(),
            type: document.getElementById("accountType").value,
            balance: Number(document.getElementById("balance").value)
        };

        if (!account.number || !account.name ||
            !account.type || !Number.isFinite(account.balance) ||
            account.balance < 0) {
            alert("Please enter valid account details!");
            return;
        }

        const duplicate = accounts.some((a, i) =>
            a.number === account.number && i !== editIndex
        );

        if (duplicate) {
            alert("Account number already exists!");
            return;
        }

        if (editIndex === -1) {

            accounts.push(account);
            alert("Account Added Successfully!");

        } else {

            accounts[editIndex] = account;
            alert("Account Updated Successfully!");

            editIndex = -1;
        }

        saveAccounts();
        displayAccounts();
        resetForm();
    });

    // UPDATE - Edit Account
    function editAccount(index) {

        const account = accounts[index];

        document.getElementById("accountNumber").value =
            account.number;

        document.getElementById("customerName").value =
            account.name;

        document.getElementById("accountType").value =
            account.type;

        document.getElementById("balance").value =
            account.balance;

        editIndex = index;

        document.getElementById("formTitle").textContent =
            "Update Bank Account";

        document.getElementById("submitButton").textContent =
            "Update Account";

        document.getElementById("cancelButton").hidden = false;
    }

    // DELETE - Remove Account
    function deleteAccount(index) {

        if (confirm("Are you sure you want to delete this account?")) {

            accounts.splice(index, 1);

            saveAccounts();
            displayAccounts();
            resetForm();

            alert("Account Deleted Successfully!");
        }
    }

    // Reset Form
    function resetForm() {

        form.reset();

        editIndex = -1;

        document.getElementById("formTitle").textContent =
            "Add Bank Account";

        document.getElementById("submitButton").textContent =
            "Add Account";

        document.getElementById("cancelButton").hidden = true;
    }

    // Cancel Edit
    document.getElementById("cancelButton").addEventListener(
        "click", resetForm
    );

    // Display records when page loads
    displayAccounts();

</script>

</body>
</html>
